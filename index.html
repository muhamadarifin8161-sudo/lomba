<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Penjurian</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 8px 12px;
      height: 100vh;
      width: 100vw;
      background: #0f1015;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .bar-kontrol-atas {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181b26;
      border: 1px solid #2e354f;
      border-radius: 8px;
      padding: 6px 12px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .btn-reset-utama {
      background: #dc2626 !important;
      border: 2px solid #fca5a5 !important;
      color: #ffffff !important;
      font-size: 14px !important;
      font-weight: 900 !important;
      padding: 8px 20px !important;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.7);
      letter-spacing: 0.5px;
    }
    .btn-reset-utama:active {
      transform: scale(0.96);
      background: #b91c1c !important;
    }
    .grup-kanan {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-live {
      font-size: 11px;
      color: #00e676;
      font-weight: bold;
    }
    .badge-pin {
      background: #0284c7;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid #38bdf8;
    }
    .btn-layar {
      background: #2a2f42;
      color: #e2e8f0;
      border: 1px solid #434c69;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .leaderboard-tv {
      background: #171923;
      border: 1px solid #2d3248;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .judul-top {
      font-size: 11px;
      font-weight: bold;
      color: #00e676;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .grid-top {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
    }
    .card-rank {
      background: #202434;
      border-radius: 5px;
      padding: 3px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-top: 3px solid #4a5568;
    }
    .rank-1 { border-top-color: #ffd700; background: #2d2612; }
    .rank-2 { border-top-color: #e2e8f0; background: #222736; }
    .rank-3 { border-top-color: #cd7f32; background: #291e17; }
    .posisi-teks { font-size: 10px; font-weight: bold; color: #94a3b8; }
    .rank-1 .posisi-teks { color: #ffd700; }
    .rank-2 .posisi-teks { color: #e2e8f0; }
    .rank-3 .posisi-teks { color: #cd7f32; }
    .gantangan-teks { font-size: 13px; font-weight: 800; margin: 1px 0; }
    .poin-teks { font-size: 16px; font-weight: 900; color: #ffeb3b; }
    .grid-header {
      font-size: 11px;
      font-weight: bold;
      color: #64748b;
      margin-bottom: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .kontainer-150 {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 3px;
      min-height: 0;
    }
    .box-gantangan {
      background: #171923;
      border: 1px solid #232738;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 0;
      transition: background-color 0.2s;
    }
    .box-gantangan .no-gtg {
      font-size: 9px;
      color: #64748b;
      font-weight: 700;
      line-height: 1;
    }
    .box-gantangan .skor-gtg {
      font-size: 15px;
      font-weight: 900;
      color: #fffa65;
      line-height: 1.1;
      margin-top: 1px;
    }
    .box-gantangan.hit {
      background-color: #00e676 !important;
      border-color: #ffffff !important;
      transform: scale(1.05);
    }
    .box-gantangan.hit .no-gtg { color: #000; }
    .box-gantangan.hit .skor-gtg { color: #000 !important; }
  </style>
</head>
<body>

  <div class="bar-kontrol-atas">
    <button class="btn-reset-utama" id="btnResetMaster" onclick="eksekusiResetSemua()">RESET KELAS (Tekan 3x)</button>

    <div class="grup-kanan">
      <span class="status-live">● REALTIME</span>
      <span class="badge-pin" onclick="aturPIN()" title="Klik untuk ubah PIN">🔑 <span id="labelPIN">PIN: 1234</span></span>
      <button class="btn-layar" onclick="toggleLayarPenuh()">⛶ Fullscreen</button>
    </div>
  </div>

  <div class="leaderboard-tv">
    <div class="judul-top">🏆 Klasemen 10 Besar (Poin Terbanyak)</div>
    <div class="grid-top" id="top10Container"></div>
  </div>

  <div class="grid-header">Status 150 Gantangan:</div>
  <div class="kontainer-150" id="kotak150Container"></div>

<script>
  const FIREBASE_URL = "https://perkututonline-bc4f1-default-rtdb.firebaseio.com/";

  const gridContainer = document.getElementById('kotak150Container');
  const topContainer = document.getElementById('top10Container');
  let dataSemuaGantangan = {};
  let hitungReset = 0;
  let timerReset = null;

  // Inisialisasi 150 kotak gantangan di layar
  for (let i = 1; i <= 150; i++) {
    dataSemuaGantangan[i] = 0;
    const box = document.createElement('div');
    box.className = 'box-gantangan';
    box.id = `box-${i}`;
    box.innerHTML = `
      <span class="no-gtg">${i}</span>
      <span class="skor-gtg" id="layar-${i}">0</span>
    `;
    gridContainer.appendChild(box);
  }

  // Sinkronisasi data berkala dari Firebase (Stabil & Anti-Putus)
  function sinkronkanInduk() {
    fetch(`${FIREBASE_URL}skor.json`)
      .then(res => res.json())
      .then(data => {
        if (!data) data = {};
        for (let i = 1; i <= 150; i++) {
          let nilaiBaru = data[i] || 0;
          if (dataSemuaGantangan[i] !== nilaiBaru) {
            dataSemuaGantangan[i] = nilaiBaru;
            document.getElementById(`layar-${i}`).innerText = nilaiBaru;
            
            // Efek kedip hijau saat skor bertambah
            const boxEl = document.getElementById(`box-${i}`);
            boxEl.classList.add('hit');
            setTimeout(() => boxEl.classList.remove('hit'), 350);
          }
        }
        perbaruiTop10();
      }).catch(() => {});

    // Sinkronisasi PIN juri
    fetch(`${FIREBASE_URL}pin_juri.json`)
      .then(res => res.json())
      .then(pin => {
        if (pin) document.getElementById('labelPIN').innerText = `PIN: ${pin}`;
      }).catch(() => {});
  }

  // Jalankan interval sinkronisasi setiap 1.5 detik
  setInterval(sinkronkanInduk, 1500);
  sinkronkanInduk();

  function resetTampilanLokal() {
    for (let i = 1; i <= 150; i++) {
      dataSemuaGantangan[i] = 0;
      document.getElementById(`layar-${i}`).innerText = 0;
    }
  }

  function perbaruiTop10() {
    let urutan = [];
    for (let i = 1; i <= 150; i++) {
      urutan.push({ no: i, poin: dataSemuaGantangan[i] || 0 });
    }

    urutan.sort((a, b) => b.poin - a.poin || a.no - b.no);
    const top10 = urutan.slice(0, 10);

    topContainer.innerHTML = '';
    top10.forEach((item, idx) => {
      const posisi = idx + 1;
      const card = document.createElement('div');
      
      let badge = '';
      if (posisi === 1) badge = 'rank-1';
      else if (posisi === 2) badge = 'rank-2';
      else if (posisi === 3) badge = 'rank-3';

      card.className = `card-rank ${badge}`;
      card.innerHTML = `
        <span class="posisi-teks">#${posisi}</span>
        <span class="gantangan-teks">G-${item.no}</span>
        <span class="poin-teks">${item.poin}</span>
      `;
      topContainer.appendChild(card);
    });
  }

  function eksekusiResetSemua() {
    hitungReset++;
    clearTimeout(timerReset);
    const btn = document.getElementById('btnResetMaster');
    btn.innerText = `KONFIRMASI (${hitungReset}/3)`;

    if (hitungReset >= 3) {
      btn.innerText = "MEMBERSIHKAN...";

      const resetObj = {};
      for (let i = 1; i <= 150; i++) resetObj[i] = 0;

      fetch(`${FIREBASE_URL}skor.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(resetObj)
      })
      .then(() => {
        resetTampilanLokal();
        perbaruiTop10();
        hitungReset = 0;
        btn.innerText = 'RESET KELAS (Tekan 3x)';
      })
      .catch(() => {
        alert('Gagal menghubungi server! Periksa internet.');
        hitungReset = 0;
        btn.innerText = 'RESET KELAS (Tekan 3x)';
      });
    } else {
      timerReset = setTimeout(() => {
        hitungReset = 0;
        btn.innerText = 'RESET KELAS (Tekan 3x)';
      }, 3000);
    }
  }

  function aturPIN() {
    const pinBaru = prompt("Masukkan PIN Juri Baru (misal: 1234):");
    if (pinBaru !== null && pinBaru.trim() !== "") {
      fetch(`${FIREBASE_URL}pin_juri.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(pinBaru.trim())
      }).then(() => alert(`PIN berhasil diubah jadi: ${pinBaru.trim()}`));
    }
  }

  function toggleLayarPenuh() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }
</script>

</body>
</html>
