<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoring Penjurian</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh;
      width: 100vw;
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 3px 4px;
    }
    #lockScreenOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #090d16;
      color: white;
      z-index: 9999999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    .lock-box {
      background: #181b26;
      border: 1px solid #2e354f;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 340px;
    }
    .input-sewa {
      width: 100%;
      padding: 9px;
      font-size: 0.95rem;
      border-radius: 5px;
      border: 1px solid #38bdf8;
      background: #0f1015;
      color: #fff;
      text-align: center;
      font-weight: bold;
      margin: 10px 0;
      text-transform: uppercase;
    }
    .btn-buka-sewa {
      background: #00e676;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }

    /* BAR KONTROL ATAS */
    .bar-kontrol-atas {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #151b28;
      border: 1px solid #283248;
      border-radius: 5px;
      padding: 2px 5px;
      margin-bottom: 3px;
      flex-shrink: 0;
      gap: 4px;
    }
    .btn-reset-utama {
      background: #dc2626 !important;
      border: 1px solid #fca5a5 !important;
      color: #ffffff !important;
      font-size: 9.5px !important;
      font-weight: 800 !important;
      padding: 3px 7px !important;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-reset-utama:active { transform: scale(0.96); background: #b91c1c !important; }

    .grup-kanan { 
      display: flex; 
      align-items: center; 
      gap: 3px; 
      flex-shrink: 0; 
    }
    .badge-room {
      background: #eab308;
      color: #000;
      font-size: 8px;
      font-weight: 900;
      padding: 1.5px 4px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .badge-sewa {
      background: #15803d;
      color: #fff;
      font-size: 8px;
      font-weight: bold;
      padding: 1.5px 4px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .badge-pin {
      background: #0284c7;
      color: #fff;
      font-size: 8px;
      font-weight: bold;
      padding: 1.5px 4px;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid #38bdf8;
      white-space: nowrap;
    }
    .btn-salin-link {
      background: #4f46e5;
      color: #ffffff;
      border: 1px solid #818cf8;
      border-radius: 3px;
      padding: 1.5px 5px;
      font-size: 8px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-layar {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 3px;
      padding: 1.5px 4px;
      font-size: 8px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .badge-live-penonton {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1e1b4b;
      border: 1px solid #4338ca;
      color: #c7d2fe;
      font-size: 8px;
      font-weight: 800;
      padding: 1.5px 5px;
      border-radius: 3px;
    }
    .dot-live {
      width: 5px; height: 5px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 5px #ef4444;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* POPUP SALIN LINK */
    #modalLinkPenonton {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      z-index: 999999;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }
    .box-modal {
      background: #181b26;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 14px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .input-url-box {
      width: 100%;
      padding: 7px;
      background: #0f1015;
      border: 1px solid #2e354f;
      color: #38bdf8;
      font-size: 11px;
      border-radius: 4px;
      margin: 8px 0;
      text-align: center;
    }
    .btn-aksi-modal { display: flex; gap: 6px; justify-content: center; }
    .btn-m-salin { background: #00e676; color: #000; border: none; padding: 5px 10px; font-size: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .btn-m-buka { background: #0284c7; color: #fff; border: none; padding: 5px 10px; font-size: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; text-decoration: none; }
    .btn-m-tutup { background: #334155; color: #cbd5e1; border: none; padding: 5px 10px; font-size: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; }

    /* LEADERBOARD TOP 10 */
    .leaderboard-tv {
      background: #131825;
      border: 1px solid #21293e;
      border-radius: 5px;
      padding: 2px 4px;
      margin-bottom: 3px;
      flex-shrink: 0;
    }
    .judul-top {
      font-size: 8.5px;
      font-weight: 800;
      color: #00e676;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .grid-top {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 2.5px;
    }
    .card-rank {
      background: #192033;
      border-radius: 3px;
      padding: 2px 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-top: 2px solid #475569;
      min-width: 0;
    }
    .rank-1 { border-top-color: #ffd700; background: #2a220d; }
    .rank-2 { border-top-color: #cbd5e1; background: #1e2538; }
    .rank-3 { border-top-color: #f59e0b; background: #26190e; }
    .posisi-teks { font-size: 7.5px; font-weight: bold; color: #94a3b8; }
    .rank-1 .posisi-teks { color: #ffd700; }
    .rank-2 .posisi-teks { color: #f1f5f9; }
    .rank-3 .posisi-teks { color: #f59e0b; }
    .gantangan-teks { font-size: 8.5px; font-weight: 800; white-space: nowrap; }
    .poin-teks { font-size: 11px; font-weight: 900; color: #ffeb3b; line-height: 1; }

    /* GRID 150 GANTANGAN (15 KOLOM X 10 BARIS PASTI PAS 1 LAYAR) */
    .area-gantangan-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #0f131f;
      border: 1px solid #1e2638;
      border-radius: 5px;
      padding: 3px 2px;
      overflow: hidden;
    }
    .grid-header {
      font-size: 8.5px;
      font-weight: bold;
      color: #64748b;
      margin-bottom: 2px;
      text-transform: uppercase;
      padding-left: 2px;
      flex-shrink: 0;
    }
    .kontainer-150 {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(15, minmax(0, 1fr));
      grid-template-rows: repeat(10, minmax(0, 1fr));
      gap: 1.5px;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    /* KOTAK GANTANGAN */
    .box-gantangan {
      background: #141926;
      border: 1px solid #232d42;
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      overflow: visible;
      position: relative;
      transition: transform 0.15s, background-color 0.15s, border-color 0.15s, box-shadow 0.15s;
      min-width: 0;
      min-height: 0;
    }

    /* KOP NOMOR GANTANGAN */
    .box-gantangan .header-no {
      background: #232d44;
      color: #f8fafc;
      font-size: 7.5px;
      font-weight: 800;
      text-align: center;
      line-height: 1.15;
      padding: 1px 0;
      width: 100%;
      display: block;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      border-top-left-radius: 2px;
      border-top-right-radius: 2px;
    }

    /* AREA POIN */
    .box-gantangan .area-poin {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
      padding: 0;
      overflow: hidden;
    }
    .box-gantangan .skor-gtg {
      font-size: 10.5px;
      font-weight: 900;
      color: #526079; /* 0 berwarna redup */
      line-height: 1;
      white-space: nowrap;
      text-align: center;
      display: inline-block;
    }

    /* WARNA JIKA ADA POIN */
    .skor-gtg.ada-poin {
      color: #facc15 !important; /* Kuning terang */
    }

    /* KHUSUS POIN 3 DIGIT */
    .skor-gtg.tiga-digit {
      font-size: 8.5px !important;
      letter-spacing: -0.8px;
      transform: scaleX(0.85);
      transform-origin: center;
    }

    /* EFEK NILAI MASUK (NEON GLOW PULSE) */
    .box-gantangan.hit {
      background: #064e3b !important;
      border-color: #00e676 !important;
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.9) !important;
      transform: scale(1.12);
      z-index: 10;
    }
    .box-gantangan.hit .header-no {
      background: #00e676 !important;
      color: #000000 !important;
      font-weight: 900;
    }
    .box-gantangan.hit .skor-gtg {
      color: #ffffff !important;
      text-shadow: 0 0 6px #00e676;
    }

    @media (max-height: 480px) and (orientation: landscape) {
      body { padding: 2px; }
      .bar-kontrol-atas, .leaderboard-tv { margin-bottom: 2px; }
      .box-gantangan .header-no { font-size: 7px; padding: 0.5px 0; }
      .box-gantangan .skor-gtg { font-size: 9.5px; }
      .skor-gtg.tiga-digit { font-size: 8px !important; }
    }
  </style>
</head>
<body>

  <!-- MODAL SALIN LINK PENONTON -->
  <div id="modalLinkPenonton">
    <div class="box-modal">
      <h4 style="color:#38bdf8; font-size:12px; margin-bottom:4px;">🔗 Tautan Penonton (<span id="modalRoomJudul">ROOM 1</span>)</h4>
      <p style="font-size:9.5px; color:#94a3b8;">Penonton hanya bisa melihat skor secara realtime tanpa akses tombol reset maupun PIN juri.</p>
      
      <input type="text" id="inputUrlPenonton" class="input-url-box" readonly>

      <div class="btn-aksi-modal">
        <button class="btn-m-salin" onclick="salinUrlPenonton()">📋 Salin Link</button>
        <a id="linkBukaPenonton" href="#" target="_blank" class="btn-m-buka">👁️ Buka</a>
        <button class="btn-m-tutup" onclick="tutupModalLink()">Tutup</button>
      </div>
    </div>
  </div>

  <!-- OVERLAY SEWA JURI (TIDAK AKTIF DI PENONTON) -->
  <div id="lockScreenOverlay" style="display:none;">
    <div class="lock-box">
      <div style="font-size:2.2rem; margin-bottom:6px;">🔒</div>
      <h3 style="color:#00e676; margin-bottom:5px; font-size:14px;">AKSES SISTEM TERKUNCI</h3>
      <p style="font-size:0.75rem; color:#94a3b8;">Masa aktif sewa monitoring telah berakhir.</p>
      <input type="text" id="inKodeSewa" class="input-sewa" placeholder="KLG1-XXXX-XXXX-XXXX">
      <button class="btn-buka-sewa" onclick="verifikasiLisensiSistem()">🔓 BUKA SISTEM</button>
    </div>
  </div>

  <!-- BAR KONTROL ATAS -->
  <div class="bar-kontrol-atas">
    <button class="btn-reset-utama" id="btnResetMaster" onclick="eksekusiResetSemua()">RESET (3x)</button>

    <div class="badge-live-penonton" id="badgeLivePenonton" style="display:none;">
      <span class="dot-live"></span> MONITOR PENONTON
    </div>

    <div class="grup-kanan">
      <button class="btn-salin-link" id="btnBukaLinkModal" onclick="bukaModalLink()">🔗 Link Penonton</button>
      <span class="badge-room" id="badgeRoom">ROOM 1</span>
      <span class="badge-sewa" id="badgeMasaSewa">Aktif</span>
      <span class="badge-pin" id="badgePin" onclick="aturPIN()" title="Klik untuk ubah PIN">🔑 <span id="labelPIN">PIN: 1234</span></span>
      <button class="btn-layar" onclick="toggleLayarPenuh()">⛶ Layar</button>
    </div>
  </div>

  <!-- LEADERBOARD TOP 10 -->
  <div class="leaderboard-tv">
    <div class="judul-top">🏆 Klasemen 10 Besar</div>
    <div class="grid-top" id="top10Container"></div>
  </div>

  <!-- 150 GANTANGAN (15 x 10) -->
  <div class="area-gantangan-wrapper">
    <div class="grid-header">Status 150 Gantangan:</div>
    <div class="kontainer-150" id="kotak150Container"></div>
  </div>

  <script>
    var urlParams = new URLSearchParams(window.location.search);
    var IS_PENONTON = urlParams.get('penonton') === "1";
    var ROOM_DARI_URL = urlParams.get('room');

    var ROOM_AKTIF = ROOM_DARI_URL || localStorage.getItem('nomor_room_sewa') || "1";
    if(!["1", "2", "3", "4", "5"].includes(ROOM_AKTIF)) {
      ROOM_AKTIF = "1";
    }

    document.getElementById('badgeRoom').innerText = "ROOM " + ROOM_AKTIF;
    document.getElementById('modalRoomJudul').innerText = "ROOM " + ROOM_AKTIF;

    // JIKA MODE PENONTON: HILANGKAN TOMBOL RESET, PIN, SEWA & TAMPILKAN LABEL PENONTON
    if(IS_PENONTON){
      document.getElementById('btnResetMaster').style.display = 'none';
      document.getElementById('btnBukaLinkModal').style.display = 'none';
      document.getElementById('badgeMasaSewa').style.display = 'none';
      document.getElementById('badgePin').style.display = 'none';
      document.getElementById('badgeLivePenonton').style.display = 'inline-flex';
    }

    var KUNCI_RAHASIA = "WAHYU_KOLONG_PEKALONGAN_99";
    var PIN_MASTER = "889900";
    var BASE_FIREBASE = "https://perkututonline-bc4f1-default-rtdb.firebaseio.com/";
    var FIREBASE_URL = BASE_FIREBASE + "room" + ROOM_AKTIF + "/";

    function hitungUrlPenonton(){
      var cleanUrl = window.location.origin + window.location.pathname;
      return cleanUrl + "?penonton=1&room=" + ROOM_AKTIF;
    }

    function bukaModalLink(){
      var url = hitungUrlPenonton();
      document.getElementById('inputUrlPenonton').value = url;
      document.getElementById('linkBukaPenonton').href = url;
      document.getElementById('modalLinkPenonton').style.display = 'flex';
    }

    function tutupModalLink(){
      document.getElementById('modalLinkPenonton').style.display = 'none';
    }

    function salinUrlPenonton(){
      var inputEl = document.getElementById('inputUrlPenonton');
      inputEl.select();
      inputEl.setSelectionRange(0, 99999);
      if(navigator.clipboard){
        navigator.clipboard.writeText(inputEl.value).then(function(){
          alert('✅ Tautan Penonton ROOM ' + ROOM_AKTIF + ' Berhasil Disalin!');
        });
      } else {
        document.execCommand('copy');
        alert('✅ Tautan Penonton ROOM ' + ROOM_AKTIF + ' Berhasil Disalin!');
      }
    }

    function hitungHash(str){
      var hash = 0;
      for (var i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash).toString(16).toUpperCase();
    }

    function cekStatusSewa(){
      if(IS_PENONTON) return true;
      var exp = localStorage.getItem('burung_license_exp');
      var now = new Date().getTime();
      if(!exp || now > parseInt(exp)){
        document.getElementById('lockScreenOverlay').style.display = 'flex';
        document.getElementById('badgeMasaSewa').innerText = '🔒 Kunci';
        document.getElementById('badgeMasaSewa').style.background = '#dc2626';
        return false;
      } else {
        document.getElementById('lockScreenOverlay').style.display = 'none';
        var d = new Date(parseInt(exp));
        document.getElementById('badgeMasaSewa').innerText = `${d.getDate()}/${d.getMonth()+1}/${String(d.getFullYear()).slice(-2)}`;
        document.getElementById('badgeMasaSewa').style.background = '#15803d';
        return true;
      }
    }

    function verifikasiLisensiSistem(){
      var input = document.getElementById('inKodeSewa').value.trim().toUpperCase();
      if(!input) return alert('Masukkan kode lisensi!');

      if(input === PIN_MASTER){
        localStorage.setItem('burung_license_exp', new Date().getTime() + (365*24*60*60*1000));
        localStorage.setItem('nomor_room_sewa', "1");
        alert('🔓 Akses Master Pemilik Diterima! Room 1 Aktif 1 Tahun.');
        location.reload();
        return;
      }

      var parts = input.split('-');
      if(parts.length === 4 && parts[0].startsWith("KLG")){
        var roomNo = parts[0].replace("KLG", "");
        if(!["1", "2", "3", "4", "5"].includes(roomNo)){
          return alert('❌ Nomor Room dalam kode tidak valid (hanya 1-5)!');
        }

        var gabung = parts[1] + parts[2];
        var checksumInput = parts[3].toUpperCase();
        var angkaStr = '';
        for(var i = 0; i < gabung.length; i++){
          angkaStr += (gabung.charCodeAt(i) - 65).toString();
        }

        var validHash = hitungHash(parts[0] + angkaStr + KUNCI_RAHASIA).substring(0, 5);

        if(checksumInput === validHash && angkaStr.length === 8){
          var thn = parseInt(angkaStr.substring(0, 4));
          var bln = parseInt(angkaStr.substring(4, 6)) - 1;
          var tgl = parseInt(angkaStr.substring(6, 8));
          var expDate = new Date(thn, bln, tgl, 23, 59, 59).getTime();

          if(expDate > new Date().getTime()){
            localStorage.setItem('nomor_room_sewa', roomNo);
            localStorage.setItem('burung_license_exp', expDate);
            alert('🔓 Sistem Berhasil Diaktifkan untuk ROOM ' + roomNo + '!');
            location.reload();
            return;
          } else {
            return alert('❌ Masa berlaku lisensi sudah kedaluwarsa!');
          }
        }
      }
      alert('❌ Kode Lisensi Sewa Tidak Valid!');
    }

    if(!IS_PENONTON){
      setInterval(cekStatusSewa, 60000);
      cekStatusSewa();
    }

    var gridContainer = document.getElementById('kotak150Container');
    var topContainer = document.getElementById('top10Container');
    var dataSemuaGantangan = {};
    var hitungReset = 0;
    var timerReset = null;

    function pasangSkorElemen(no, skor){
      var el = document.getElementById(`layar-${no}`);
      if(el){
        el.innerText = skor;
        if(skor > 0) el.classList.add('ada-poin');
        else el.classList.remove('ada-poin');

        if(skor >= 100) el.classList.add('tiga-digit');
        else el.classList.remove('tiga-digit');
      }
    }

    // Grid 150 kotak
    for(var i = 1; i <= 150; i++){
      dataSemuaGantangan[i] = 0;
      var elDiv = document.createElement('div');
      elDiv.className = 'box-gantangan';
      elDiv.id = `box-${i}`;
      elDiv.innerHTML = `
        <span class="header-no">${i}</span>
        <div class="area-poin">
          <span class="skor-gtg" id="layar-${i}">0</span>
        </div>
      `;
      gridContainer.appendChild(elDiv);
    }

    var eventSource = new EventSource(`${FIREBASE_URL}.json`);
    eventSource.addEventListener('put', function(e){
      if(!IS_PENONTON && !cekStatusSewa()) return;
      var d = JSON.parse(e.data);
      var p = d.path;
      var val = d.data;

      if(p === "/" || p === ""){
        if(val){
          if(val.skor){
            for(var k = 1; k <= 150; k++){
              dataSemuaGantangan[k] = val.skor[k] || 0;
              pasangSkorElemen(k, dataSemuaGantangan[k]);
            }
          } else { resetTampilanLokal(); }
          if(val.pin_juri && !IS_PENONTON){
            document.getElementById('labelPIN').innerText = `PIN: ${val.pin_juri}`;
          }
        } else { resetTampilanLokal(); }
        perbaruiTop10();
      } else if(p === "/pin_juri"){
        if(!IS_PENONTON) document.getElementById('labelPIN').innerText = `PIN: ${val}`;
      } else if(p === "/skor"){
        for(var m = 1; m <= 150; m++){
          dataSemuaGantangan[m] = (val && val[m]) ? val[m] : 0;
          pasangSkorElemen(m, dataSemuaGantangan[m]);
        }
        perbaruiTop10();
      } else if(p.startsWith("/skor/")){
        var gtg = parseInt(p.replace("/skor/", ""));
        if(gtg >= 1 && gtg <= 150){
          dataSemuaGantangan[gtg] = val || 0;
          pasangSkorElemen(gtg, val || 0);
          var b = document.getElementById(`box-${gtg}`);
          if(b){
            b.classList.add('hit');
            setTimeout(function(){ b.classList.remove('hit'); }, 300);
          }
          perbaruiTop10();
        }
      }
    });

    function resetTampilanLokal(){
      for(var i = 1; i <= 150; i++){
        dataSemuaGantangan[i] = 0;
        pasangSkorElemen(i, 0);
      }
    }

    function perbaruiTop10(){
      var list = [];
      for(var i = 1; i <= 150; i++){
        list.push({ no: i, poin: dataSemuaGantangan[i] || 0 });
      }
      list.sort(function(a,b){ return b.poin - a.poin || a.no - b.no; });
      var top10 = list.slice(0, 10);
      topContainer.innerHTML = '';
      top10.forEach(function(item, idx){
        var rk = idx + 1;
        var cd = document.createElement('div');
        var cls = rk === 1 ? 'rank-1' : rk === 2 ? 'rank-2' : rk === 3 ? 'rank-3' : '';
        cd.className = `card-rank ${cls}`;
        cd.innerHTML = `<span class="posisi-teks">#${rk}</span><span class="gantangan-teks">G-${item.no}</span><span class="poin-teks">${item.poin}</span>`;
        topContainer.appendChild(cd);
      });
    }

    function eksekusiResetSemua(){
      if(IS_PENONTON) return;
      if(!cekStatusSewa()) return;
      hitungReset++;
      clearTimeout(timerReset);
      var btn = document.getElementById('btnResetMaster');
      btn.innerText = `(${hitungReset}/3)`;

      if(hitungReset >= 3){
        btn.innerText = "...";
        var dataReset = {};
        for(var i = 1; i <= 150; i++) dataReset[i] = 0;

        fetch(`${FIREBASE_URL}skor.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataReset)
        }).then(function(){
          resetTampilanLokal();
          perbaruiTop10();
          hitungReset = 0;
          btn.innerText = 'RESET (3x)';
        }).catch(function(){
          alert('Gagal menghubungi server!');
          hitungReset = 0;
          btn.innerText = 'RESET (3x)';
        });
      } else {
        timerReset = setTimeout(function(){ hitungReset = 0; btn.innerText = 'RESET (3x)'; }, 3000);
      }
    }

    function aturPIN(){
      if(IS_PENONTON) return;
      if(!cekStatusSewa()) return;
      var baru = prompt(`Masukkan PIN Juri Baru untuk Room ${ROOM_AKTIF} (misal: 1234):`);
      if(baru !== null && baru.trim() !== ""){
        fetch(`${FIREBASE_URL}pin_juri.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(baru.trim())
        }).then(function(){
          alert(`PIN Room ${ROOM_AKTIF} berhasil diubah jadi: ${baru.trim()}`);
        });
      }
    }

    function toggleLayarPenuh(){
      if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(function(){}); }
      else { if(document.exitFullscreen) document.exitFullscreen(); }
    }
  </script>
</body>
</html>
