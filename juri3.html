<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juri Pantau 3 Burung</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .header-bar {
      height: 48px;
      background: #0f172a;
      border-bottom: 2px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      flex-shrink: 0;
    }
    .badge-info {
      background: #334155;
      color: #38bdf8;
      font-weight: 900;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .btn-reset-block {
      background: #ef4444;
      color: #fff;
      border: none;
      font-size: 11px;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      padding: 6px;
    }
    /* Tombol Besar Biru, Hijau & Oranye */
    .slot-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 12px;
      padding: 8px 4px;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.05s ease, filter 0.05s ease;
      touch-action: manipulation;
    }
    .slot-card:active {
      transform: scale(0.97);
      filter: brightness(1.2);
    }
    .slot-biru { background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); border: 3px solid #38bdf8; }
    .slot-hijau { background: linear-gradient(180deg, #16a34a 0%, #15803d 100%); border: 3px solid #4ade80; }
    .slot-oranye { background: linear-gradient(180deg, #ea580c 0%, #c2410c 100%); border: 3px solid #fb923c; }

    .gtg-header {
      text-align: center;
      background: rgba(0,0,0,0.35);
      border-radius: 8px;
      padding: 4px 2px;
    }
    .gtg-label { font-size: 10px; font-weight: 800; color: #f8fafc; letter-spacing: 0.5px; }
    .gtg-number {
      font-size: 1.9rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      line-height: 1.1;
    }
    .skor-center {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    .skor-angka {
      font-size: 4.8rem;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 4px 10px rgba(0,0,0,0.7);
      line-height: 1;
    }
    .skor-caption {
      font-size: 10px;
      font-weight: 800;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-tap-area {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      padding: 12px 0;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Modal Setup Juri */
    #loginOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #090d16;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .login-box {
      background: #1e293b;
      border: 2px solid #38bdf8;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      color: #fff;
    }
    .input-field {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #475569;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- MODAL PENGATURAN AWAL JURI -->
  <div id="loginOverlay">
    <div class="login-box">
      <h3 style="color:#38bdf8; margin-bottom:12px;">PENGATURAN JURI (PANTAU 3)</h3>
      
      <label style="font-size:11px; color:#94a3b8; display:block; text-align:left; margin-bottom:4px;">PILIH ROOM:</label>
      <select id="selRoom" class="input-field" style="font-size:0.95rem;">
        <option value="1">ROOM 1</option>
        <option value="2">ROOM 2</option>
        <option value="3">ROOM 3</option>
        <option value="4">ROOM 4</option>
        <option value="5">ROOM 5</option>
      </select>

      <label style="font-size:11px; color:#94a3b8; display:block; text-align:left; margin-bottom:4px;">NOMOR JURI (MISAL 1, 2, 3...):</label>
      <input type="number" id="inNoJuri" class="input-field" placeholder="No Juri" value="1" oninput="hitungOtomatisGtg()">

      <div id="previewJatah" style="background:#0f172a; padding:8px; border-radius:6px; font-size:12px; color:#4ade80; margin-bottom:12px; font-weight:bold;">
        Jatah Gantangan: 1, 2, dan 3
      </div>

      <input type="password" id="inPin" class="input-field" placeholder="PIN JURI" style="letter-spacing:4px;">

      <button onclick="masukJuri()" style="width:100%; padding:14px; background:#16a34a; color:white; border:none; font-weight:900; font-size:1rem; border-radius:8px; cursor:pointer;">
        MULAI PENJURIAN ➔
      </button>
    </div>
  </div>

  <!-- HEADER -->
  <div class="header-bar">
    <span class="badge-info" id="badgeRoom">ROOM 1</span>
    <span style="font-size:12px; font-weight:bold; color:#cbd5e1;" id="txtLabelJuri">JURI 1</span>
    <button class="btn-reset-block" onclick="bukaUlangSetup()">⚙️ Ganti No</button>
  </div>

  <!-- GRID 3 TOMBOL BESAR BIRU, HIJAU & ORANYE -->
  <div class="grid-container">
    <!-- BURUNG 1 (BIRU) -->
    <div class="slot-card slot-biru" onclick="tambahPoin(1)">
      <div class="gtg-header">
        <div class="gtg-label">NO GANTANGAN</div>
        <div class="gtg-number" id="labelGtg1">-</div>
      </div>
      <div class="skor-center">
        <div class="skor-caption">POIN</div>
        <div class="skor-angka" id="skor1">0</div>
      </div>
      <div class="btn-tap-area">+1</div>
    </div>

    <!-- BURUNG 2 (HIJAU) -->
    <div class="slot-card slot-hijau" onclick="tambahPoin(2)">
      <div class="gtg-header">
        <div class="gtg-label">NO GANTANGAN</div>
        <div class="gtg-number" id="labelGtg2">-</div>
      </div>
      <div class="skor-center">
        <div class="skor-caption">POIN</div>
        <div class="skor-angka" id="skor2">0</div>
      </div>
      <div class="btn-tap-area">+1</div>
    </div>

    <!-- BURUNG 3 (ORANYE) -->
    <div class="slot-card slot-oranye" onclick="tambahPoin(3)">
      <div class="gtg-header">
        <div class="gtg-label">NO GANTANGAN</div>
        <div class="gtg-number" id="labelGtg3">-</div>
      </div>
      <div class="skor-center">
        <div class="skor-caption">POIN</div>
        <div class="skor-angka" id="skor3">0</div>
      </div>
      <div class="btn-tap-area">+1</div>
    </div>
  </div>

  <script>
    var BASE_URL = "https://perkututonline-bc4f1-default-rtdb.firebaseio.com/";
    var ROOM = localStorage.getItem('juri3_room') || "1";
    var NO_JURI = parseInt(localStorage.getItem('juri3_nojuri')) || 1;
    var gtgSlot = { 1: 1, 2: 2, 3: 3 };
    var skorLokal = { 1: 0, 2: 0, 3: 0 };

    document.getElementById('selRoom').value = ROOM;
    document.getElementById('inNoJuri').value = NO_JURI;
    hitungOtomatisGtg();

    function hitungOtomatisGtg(){
      var j = parseInt(document.getElementById('inNoJuri').value) || 1;
      // Rumus otomatis jatah 3 burung: Juri 1 (1,2,3), Juri 2 (4,5,6), Juri 3 (7,8,9)
      var g1 = ((j - 1) * 3) + 1;
      var g2 = g1 + 1;
      var g3 = g1 + 2;
      document.getElementById('previewJatah').innerText = `Jatah Gantangan: ${g1}, ${g2}, dan ${g3}`;
    }

    function bukaUlangSetup(){
      document.getElementById('loginOverlay').style.display = 'flex';
    }

    function masukJuri(){
      var r = document.getElementById('selRoom').value;
      var j = parseInt(document.getElementById('inNoJuri').value) || 1;
      var pinInput = document.getElementById('inPin').value.trim();

      fetch(`${BASE_URL}room${r}/pin_juri.json`).then(res => res.json()).then(pinServer => {
        var validPin = pinServer || "1234";
        if(pinInput === validPin || pinInput === "889900"){
          ROOM = r;
          NO_JURI = j;
          localStorage.setItem('juri3_room', ROOM);
          localStorage.setItem('juri3_nojuri', NO_JURI);

          gtgSlot[1] = ((NO_JURI - 1) * 3) + 1;
          gtgSlot[2] = gtgSlot[1] + 1;
          gtgSlot[3] = gtgSlot[1] + 2;

          document.getElementById('badgeRoom').innerText = "ROOM " + ROOM;
          document.getElementById('txtLabelJuri').innerText = "JURI " + NO_JURI;
          document.getElementById('labelGtg1').innerText = gtgSlot[1];
          document.getElementById('labelGtg2').innerText = gtgSlot[2];
          document.getElementById('labelGtg3').innerText = gtgSlot[3];

          document.getElementById('loginOverlay').style.display = 'none';
          bacaRealtimeRoom();
          muatAwalSemua();
        } else {
          alert('❌ PIN Juri Salah!');
        }
      }).catch(() => alert('Gagal koneksi ke server!'));
    }

    function muatAwalSemua(){
      for(let s = 1; s <= 3; s++){
        let g = gtgSlot[s];
        fetch(`${BASE_URL}room${ROOM}/skor/${g}.json`).then(r => r.json()).then(val => {
          skorLokal[s] = val || 0;
          document.getElementById('skor' + s).innerText = skorLokal[s];
        });
      }
    }

    function bacaRealtimeRoom(){
      var es = new EventSource(`${BASE_URL}room${ROOM}/skor.json`);
      es.addEventListener('put', function(e){
        var d = JSON.parse(e.data);
        if(!d.path || d.path === "/"){
          if(d.data){
            for(var s = 1; s <= 3; s++){
              var g = gtgSlot[s];
              if(d.data[g] !== undefined){
                skorLokal[s] = d.data[g];
                document.getElementById('skor' + s).innerText = d.data[g];
              }
            }
          }
        } else {
          var no = parseInt(d.path.replace("/", ""));
          for(var s = 1; s <= 3; s++){
            if(no === gtgSlot[s]){
              skorLokal[s] = d.data || 0;
              document.getElementById('skor' + s).innerText = skorLokal[s];
            }
          }
        }
      });
    }

    function tambahPoin(slot){
      var g = gtgSlot[slot];
      var baru = (skorLokal[slot] || 0) + 1;
      skorLokal[slot] = baru;
      document.getElementById('skor' + slot).innerText = baru;

      fetch(`${BASE_URL}room${ROOM}/skor/${g}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(baru)
      });
    }
  </script>
</body>
</html>
