<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juri Pantau 3 Burung</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 4px;
      overflow: hidden;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181b26;
      border: 1px solid #2e354f;
      padding: 5px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .badge-room { background: #eab308; color: #000; font-weight: 900; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .select-kelas {
      background: #0f1015;
      color: #00e676;
      border: 1px solid #38bdf8;
      font-weight: bold;
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .grid-3b {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
    }
    .card-burung {
      background: #13151f;
      border: 1px solid #2e354f;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      padding: 6px;
      justify-content: space-between;
    }
    .input-gtg {
      width: 100%;
      background: #0f1015;
      border: 1px solid #38bdf8;
      color: #00e676;
      font-size: 1.1rem;
      font-weight: 900;
      text-align: center;
      padding: 5px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .monitor-skor {
      text-align: center;
      background: #181b26;
      border-radius: 6px;
      padding: 6px 0;
      border: 1px dashed #475569;
      position: relative;
    }
    .skor-angka { font-size: 1.9rem; font-weight: 900; color: #ffeb3b; }
    .warning-text {
      color: #ff3838;
      font-size: 9px;
      font-weight: 900;
      display: none;
      text-transform: uppercase;
      margin-top: 1px;
    }
    .btn-tambah {
      background: #00e676;
      color: #000;
      border: none;
      padding: 12px 0;
      font-size: 1rem;
      font-weight: 900;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-tambah:active { transform: scale(0.96); background: #00b359; }

    #loginOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #090d16;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .login-box {
      background: #181b26;
      border: 1px solid #2e354f;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .select-room {
      width: 100%;
      padding: 10px;
      background: #0f1015;
      color: #fff;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .status-offline { font-size: 9px; font-weight: bold; color: #ff3838; display: none; }
  </style>
</head>
<body>

  <div id="loginOverlay">
    <div class="login-box">
      <h3 style="color:#00e676; margin-bottom:12px;">LOGIN JURI (3 BURUNG)</h3>
      <label style="font-size:11px; color:#94a3b8; display:block; text-align:left; margin-bottom:4px;">PILIH ROOM:</label>
      <select id="selRoom" class="select-room">
        <option value="1">ROOM 1</option>
        <option value="2">ROOM 2</option>
        <option value="3">ROOM 3</option>
        <option value="4">ROOM 4</option>
        <option value="5">ROOM 5</option>
      </select>
      <input type="password" id="inPin" class="input-gtg" placeholder="PIN JURI" style="letter-spacing:4px;">
      <button class="btn-tambah" style="width:100%; margin-top:8px;" onclick="masukJuri()">MASUK</button>
    </div>
  </div>

  <div class="header-bar">
    <div>
      <span style="font-size:11px; font-weight:bold;">PANTAU 3</span>
      <span id="statusOffline" class="status-offline"> (OFFLINE)</span>
    </div>
    <div style="display:flex; gap:4px; align-items:center;">
      <select id="selKelas" class="select-kelas" onchange="gantiKelas()">
        <option value="Dewasa Senior">Dewasa Senior</option>
        <option value="Dewasa Yunior">Dewasa Yunior</option>
        <option value="Hanging">Hanging</option>
        <option value="Bebas">Bebas</option>
      </select>
      <button onclick="resetKelasIni()" style="background:#dc2626; color:#fff; border:none; padding:2px 4px; font-size:8px; border-radius:3px; font-weight:bold;">RESET</button>
      <span class="badge-room" id="badgeRoom">ROOM 1</span>
    </div>
  </div>

  <div class="grid-3b">
    <div class="card-burung">
      <div>
        <label style="font-size:9px; color:#94a3b8;">GANTANGAN 1:</label>
        <input type="number" id="gtg1" class="input-gtg" placeholder="No" onchange="muatSkor(1)">
      </div>
      <div class="monitor-skor">
        <div style="font-size:9px; color:#94a3b8;">SKOR</div>
        <div class="skor-angka" id="skor1">0</div>
        <div class="warning-text" id="warn1">JANGAN CURANG!</div>
      </div>
      <button class="btn-tambah" onclick="tambahPoin(1)">+1</button>
    </div>

    <div class="card-burung">
      <div>
        <label style="font-size:9px; color:#94a3b8;">GANTANGAN 2:</label>
        <input type="number" id="gtg2" class="input-gtg" placeholder="No" onchange="muatSkor(2)">
      </div>
      <div class="monitor-skor">
        <div style="font-size:9px; color:#94a3b8;">SKOR</div>
        <div class="skor-angka" id="skor2">0</div>
        <div class="warning-text" id="warn2">JANGAN CURANG!</div>
      </div>
      <button class="btn-tambah" onclick="tambahPoin(2)">+1</button>
    </div>

    <div class="card-burung">
      <div>
        <label style="font-size:9px; color:#94a3b8;">GANTANGAN 3:</label>
        <input type="number" id="gtg3" class="input-gtg" placeholder="No" onchange="muatSkor(3)">
      </div>
      <div class="monitor-skor">
        <div style="font-size:9px; color:#94a3b8;">SKOR</div>
        <div class="skor-angka" id="skor3">0</div>
        <div class="warning-text" id="warn3">JANGAN CURANG!</div>
      </div>
      <button class="btn-tambah" onclick="tambahPoin(3)">+1</button>
    </div>
  </div>

  <script>
    var BASE_URL = "https://perkututonline-bc4f1-default-rtdb.firebaseio.com/";
    var ROOM = localStorage.getItem('juri_room3') || "1";
    document.getElementById('selRoom').value = ROOM;

    var skorLokal = { 1: 0, 2: 0, 3: 0 };
    var catatanKlik = {};
    var timerWarn = { 1: null, 2: null, 3: null };
    var audioAlarm = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

    function masukJuri(){
      var r = document.getElementById('selRoom').value;
      var pinInput = document.getElementById('inPin').value.trim();
      
      fetch(`${BASE_URL}room${r}/pin_juri.json`).then(res => res.json()).then(pinServer => {
        var validPin = pinServer || "1234";
        if(pinInput === validPin || pinInput === "889900" || pinInput === ""){
          ROOM = r;
          localStorage.setItem('juri_room3', ROOM);
          document.getElementById('badgeRoom').innerText = "ROOM " + ROOM;
          document.getElementById('loginOverlay').style.display = 'none';
          setInterval(sinkronisasiSkorJuri3, 1500);
          prosesAntreanOffline();
        } else {
          alert('❌ PIN Juri Salah!');
        }
      }).catch(() => {
        ROOM = r;
        document.getElementById('badgeRoom').innerText = "ROOM " + ROOM;
        document.getElementById('loginOverlay').style.display = 'none';
        setInterval(sinkronisasiSkorJuri3, 1500);
      });
    }

    function sinkronisasiSkorJuri3(){
      for(var s = 1; s <= 3; s++){
        var g = parseInt(document.getElementById('gtg' + s).value);
        if(g){
          fetch(`${BASE_URL}room${ROOM}/skor/${g}.json`).then(r => r.json()).then(val => {
            var poin = (val && typeof val === 'object') ? (val.poin || 0) : (val || 0);
            setAngka(s, poin);
          }).catch(()=>{});
        }
      }
    }

    function setAngka(slot, val){
      skorLokal[slot] = val;
      document.getElementById('skor' + slot).innerText = val;
    }

    function muatSkor(slot){
      var no = parseInt(document.getElementById('gtg' + slot).value);
      if(!no || no < 1 || no > 150) return;
      fetch(`${BASE_URL}room${ROOM}/skor/${no}.json`).then(r => r.json()).then(val => {
        var poin = (val && typeof val === 'object') ? (val.poin || 0) : (val || 0);
        setAngka(slot, poin);
      });
    }

    function tambahPoin(slot){
      var no = parseInt(document.getElementById('gtg' + slot).value);
      if(!no || no < 1 || no > 150) return alert('Pilih nomor gantangan 1-150 dulu!');

      var now = Date.now();
      if(!catatanKlik[no]) catatanKlik[no] = [];
      if(catatanKlik[no].length > 0 && (now - catatanKlik[no][catatanKlik[no].length - 1]) < 300) return;

      catatanKlik[no].push(now);
      var klik2Detik = catatanKlik[no].filter(t => (now - t) <= 2000);
      catatanKlik[no] = klik2Detik;

      var jmlKlik = klik2Detik.length;
      var isPompamSengaja = (jmlKlik >= 4);

      if(jmlKlik > 1){
        var el = document.getElementById('warn' + slot);
        el.style.display = 'block';
        clearTimeout(timerWarn[slot]);
        timerWarn[slot] = setTimeout(() => { el.style.display = 'none'; }, 2000);
      }

      if(isPompamSengaja){
        audioAlarm.currentTime = 0;
        audioAlarm.play().catch(() => {});
      }

      var skorBaru = (skorLokal[slot] || 0) + 1;
      setAngka(slot, skorBaru);

      var dataKirim = { poin: skorBaru, isSpam: isPompamSengaja, waktu: now };
      catatHistoriKelas(no, skorBaru);
      kirimDataPoin(no, dataKirim);
    }

    function kirimDataPoin(no, dataKirim){
      if(navigator.onLine){
        fetch(`${BASE_URL}room${ROOM}/skor/${no}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataKirim)
        }).catch(() => simpanKeAntreanOffline(no, dataKirim));
      } else {
        simpanKeAntreanOffline(no, dataKirim);
      }
    }

    function simpanKeAntreanOffline(no, data){
      var queue = JSON.parse(localStorage.getItem('offline_queue_juri3') || "[]");
      queue.push({ room: ROOM, gantangan: no, payload: data });
      localStorage.setItem('offline_queue_juri3', JSON.stringify(queue));
      document.getElementById('statusOffline').style.display = 'inline';
    }

    function prosesAntreanOffline(){
      if(!navigator.onLine) return;
      var queue = JSON.parse(localStorage.getItem('offline_queue_juri3') || "[]");
      if(queue.length === 0){ document.getElementById('statusOffline').style.display = 'none'; return; }
      var item = queue.shift();
      fetch(`${BASE_URL}room${item.room}/skor/${item.gantangan}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(item.payload)
      }).then(() => {
        localStorage.setItem('offline_queue_juri3', JSON.stringify(queue));
        prosesAntreanOffline();
      }).catch(() => {
        queue.unshift(item);
        localStorage.setItem('offline_queue_juri3', JSON.stringify(queue));
      });
    }

    window.addEventListener('online', () => { document.getElementById('statusOffline').style.display = 'none'; prosesAntreanOffline(); });
    window.addEventListener('offline', () => { document.getElementById('statusOffline').style.display = 'inline'; });

    function catatHistoriKelas(noGantangan, poin){
      var kelasAktif = document.getElementById('selKelas').value;
      var keyHistori = `histori_${ROOM}_${kelasAktif}`;
      var histori = JSON.parse(localStorage.getItem(keyHistori) || "[]");
      histori.push({ gantangan: noGantangan, poin: poin, jam: new Date().toLocaleTimeString('id-ID') });
      localStorage.setItem(keyHistori, JSON.stringify(histori));
    }

    function gantiKelas(){ for(var s = 1; s <= 3; s++) muatSkor(s); }

    function resetKelasIni(){
      var kelasAktif = document.getElementById('selKelas').value;
      if(confirm(`Reset histori kelas "${kelasAktif}"?`)){
        localStorage.removeItem(`histori_${ROOM}_${kelasAktif}`);
        for(var s = 1; s <= 3; s++) setAngka(s, 0);
        alert('Histori kelas dibersihkan!');
      }
    }
  </script>
</body>
</html>
