<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juri Pantau 3 Burung - Auto Landscape + Fullscreen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* HEADER ATAS */
    .header-bar {
      height: 40px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      flex-shrink: 0;
    }
    .badge-info {
      background: #334155;
      color: #38bdf8;
      font-weight: 900;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .btn-header-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-action-sm {
      background: #334155;
      color: #fff;
      border: none;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-reset-block {
      background: #ef4444;
      color: #fff;
      border: none;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-history-menu {
      background: #3b82f6;
      color: #fff;
      border: none;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* CONTAINER UTAMA 3 KOLOM MENYAMPING (LANDSCAPE) */
    .main-landscape-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 8px;
      background: #090d16;
      height: calc(100vh - 40px);
    }

    .slot-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 10px;
      padding: 8px;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.04s ease, filter 0.04s ease;
      touch-action: manipulation;
      height: 100%;
    }
    .slot-card:active {
      transform: scale(0.97);
      filter: brightness(1.2);
    }
    .slot-biru { background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); border: 3px solid #38bdf8; }
    .slot-hijau { background: linear-gradient(180deg, #16a34a 0%, #15803d 100%); border: 3px solid #4ade80; }
    .slot-oranye { background: linear-gradient(180deg, #ea580c 0%, #c2410c 100%); border: 3px solid #fb923c; }

    .gtg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.35);
      border-radius: 6px;
      padding: 3px 8px;
    }
    .gtg-label { font-size: 10px; font-weight: 800; color: #f8fafc; letter-spacing: 0.5px; }
    .gtg-number {
      font-size: 1.2rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      line-height: 1;
    }
    .skor-center {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    .skor-angka {
      font-size: 3.8rem;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 3px 8px rgba(0,0,0,0.7);
      line-height: 1;
    }
    .skor-caption {
      font-size: 10px;
      font-weight: 800;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-tap-area {
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 8px;
      padding: 10px 0;
      text-align: center;
      font-size: 1rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    /* Modal Setup Juri */
    #loginOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #090d16;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .login-box {
      background: #1e293b;
      border: 2px solid #38bdf8;
      padding: 16px;
      border-radius: 12px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      color: #fff;
    }
    .input-field {
      width: 100%;
      padding: 8px;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
    }

    /* Modal History Kelas */
    #historyModal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(9, 13, 22, 0.85);
      z-index: 9999;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .history-box {
      background: #1e293b;
      border: 2px solid #3b82f6;
      padding: 14px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      color: #fff;
    }
    .history-list {
      overflow-y: auto;
      flex: 1;
      margin: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-item {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item-info { font-size: 11px; }
    .history-item-title { font-weight: bold; color: #38bdf8; font-size: 12px; }
    .btn-history-reset {
      background: #ef4444;
      color: white;
      border: none;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- MODAL PENGATURAN AWAL JURI -->
  <div id="loginOverlay">
    <div class="login-box">
      <h3 style="color:#38bdf8; margin-bottom:8px; font-size:14px;">PENGATURAN JURI (PANTAU 3)</h3>
      
      <label style="font-size:10px; color:#94a3b8; display:block; text-align:left; margin-bottom:2px;">PILIH ROOM:</label>
      <select id="selRoom" class="input-field" style="font-size:0.9rem;">
        <option value="1">ROOM 1</option>
        <option value="2">ROOM 2</option>
        <option value="3">ROOM 3</option>
        <option value="4">ROOM 4</option>
        <option value="5">ROOM 5</option>
      </select>

      <label style="font-size:10px; color:#94a3b8; display:block; text-align:left; margin-bottom:2px;">NOMOR JURI (MISAL 1, 2, 3...):</label>
      <input type="number" id="inNoJuri" class="input-field" placeholder="No Juri" value="1" oninput="hitungOtomatisGtg()">

      <div id="previewJatah" style="background:#0f172a; padding:6px; border-radius:6px; font-size:11px; color:#4ade80; margin-bottom:8px; font-weight:bold;">
        Jatah Gantangan: 1, 2, dan 3
      </div>

      <input type="password" id="inPin" class="input-field" placeholder="PIN JURI" style="letter-spacing:4px;">

      <button onclick="masukJuri()" style="width:100%; padding:10px; background:#16a34a; color:white; border:none; font-weight:900; font-size:0.95rem; border-radius:6px; cursor:pointer;">
        MULAI PENJURIAN ➔
      </button>
    </div>
  </div>

  <!-- MODAL RIWAYAT KELAS -->
  <div id="historyModal">
    <div class="history-box">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:6px;">
        <h3 style="color:#38bdf8; font-size:13px;">📜 RIWAYAT KELAS & SKOR</h3>
        <button onclick="tutupHistory()" style="background:none; border:none; color:#94a3b8; font-size:14px; font-weight:bold; cursor:pointer;">✕</button>
      </div>
      <div class="history-list" id="kontainerHistory">
        <div style="text-align:center; color:#64748b; font-size:11px; margin-top:20px;">Memuat riwayat kelas...</div>
      </div>
      <button onclick="tutupHistory()" style="width:100%; padding:8px; background:#334155; color:white; border:none; font-weight:bold; border-radius:6px; cursor:pointer; margin-top:2px; font-size:11px;">TUTUP</button>
    </div>
  </div>

  <!-- HEADER ATAS -->
  <div class="header-bar">
    <span class="badge-info" id="badgeRoom">ROOM 1</span>
    <div style="text-align:center; display:flex; gap:6px; align-items:center;">
      <span style="font-size:11px; font-weight:bold; color:#cbd5e1;" id="txtLabelJuri">JURI 1</span>
      <span style="font-size:10px; color:#38bdf8;" id="txtInfoKelas">Kelas: -</span>
    </div>
    <div class="btn-header-group">
      <button class="btn-action-sm" onclick="toggleFullscreen()" id="btnFs" title="Layar Penuh">⛶ Full</button>
      <button class="btn-history-menu" onclick="bukaHistory()">📋 Hist</button>
      <button class="btn-reset-block" onclick="bukaUlangSetup()">⚙️ Ganti</button>
    </div>
  </div>

  <!-- CONTAINER 3 KOLOM MENYAMPING SECARA ALAMI (TANPA ROTATE) -->
  <div class="main-landscape-container">
    <!-- BURUNG 1 (BIRU) -->
    <div class="slot-card slot-biru" onclick="tambahPoin(1)">
      <div class="gtg-header">
        <div class="gtg-label">GANTANGAN</div>
        <div class="gtg-number" id="labelGtg1">-</div>
      </div>
      <div class="skor-center">
        <div class="skor-caption">POIN</div>
        <div class="skor-angka" id="skor1">0</div>
      </div>
      <div class="btn-tap-area">+1 TAMBAH</div>
    </div>

    <!-- BURUNG 2 (HIJAU) -->
    <div class="slot-card slot-hijau" onclick="tambahPoin(2)">
      <div class="gtg-header">
        <div class="gtg-label">GANTANGAN</div>
        <div class="gtg-number" id="labelGtg2">-</div>
      </div>
      <div class="skor-center">
        <div class="skor-caption">POIN</div>
        <div class="skor-angka" id="skor2">0</div>
      </div>
      <div class="btn-tap-area">+1 TAMBAH</div>
    </div>

    <!-- BURUNG 3 (ORANYE) -->
    <div class="slot-card slot-oranye" onclick="tambahPoin(3)">
      <div class="gtg-header">
        <div class="gtg-label">GANTANGAN</div>
        <div class="gtg-number" id="labelGtg3">-</div>
      </div>
      <div class="skor-center">
        <div class="skor-caption">POIN</div>
        <div class="skor-angka" id="skor3">0</div>
      </div>
      <div class="btn-tap-area">+1 TAMBAH</div>
    </div>
  </div>

  <script>
    var BASE_URL = "https://perkututonline-bc4f1-default-rtdb.firebaseio.com/";
    var ROOM = localStorage.getItem('juri3_room') || "1";
    var NO_JURI = parseInt(localStorage.getItem('juri3_nojuri')) || 1;
    var gtgSlot = { 1: 1, 2: 2, 3: 3 };
    var skorLokal = { 1: 0, 2: 0, 3: 0 };
    var kelasAktif = "-";
    var terakhirDipencet = { 1: 0, 2: 0, 3: 0 };

    document.getElementById('selRoom').value = ROOM;
    document.getElementById('inNoJuri').value = NO_JURI;
    hitungOtomatisGtg();

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`Error attempting to enable fullscreen: ${err.message}`);
        });
        document.getElementById('btnFs').innerText = "⛶ Exit";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
        document.getElementById('btnFs').innerText = "⛶ Full";
      }
    }

    function hitungOtomatisGtg(){
      var j = parseInt(document.getElementById('inNoJuri').value) || 1;
      var g1 = ((j - 1) * 3) + 1;
      var g2 = g1 + 1;
      var g3 = g1 + 2;
      document.getElementById('previewJatah').innerText = `Jatah Gantangan: ${g1}, ${g2}, dan ${g3}`;
    }

    function bukaUlangSetup(){
      document.getElementById('loginOverlay').style.display = 'flex';
    }

    function masukJuri(){
      var r = document.getElementById('selRoom').value;
      var j = parseInt(document.getElementById('inNoJuri').value) || 1;
      var pinInput = document.getElementById('inPin').value.trim();

      fetch(`${BASE_URL}room${r}/pin_juri.json`).then(res => res.json()).then(pinServer => {
        var validPin = pinServer || "1234";
        if(pinInput === validPin || pinInput === "889900"){
          ROOM = r;
          NO_JURI = j;
          localStorage.setItem('juri3_room', ROOM);
          localStorage.setItem('juri3_nojuri', NO_JURI);

          gtgSlot[1] = ((NO_JURI - 1) * 3) + 1;
          gtgSlot[2] = gtgSlot[1] + 1;
          gtgSlot[3] = gtgSlot[1] + 2;

          document.getElementById('badgeRoom').innerText = "ROOM " + ROOM;
          document.getElementById('txtLabelJuri').innerText = "JURI " + NO_JURI;
          document.getElementById('labelGtg1').innerText = gtgSlot[1];
          document.getElementById('labelGtg2').innerText = gtgSlot[2];
          document.getElementById('labelGtg3').innerText = gtgSlot[3];

          document.getElementById('loginOverlay').style.display = 'none';
          bacaRealtimeRoom();
          muatAwalSemua();
        } else {
          alert('❌ PIN Juri Salah!');
        }
      }).catch(() => alert('Gagal koneksi ke server!'));
    }

    function muatAwalSemua(){
      for(let s = 1; s <= 3; s++){
        let g = gtgSlot[s];
        fetch(`${BASE_URL}room${ROOM}/skor/${g}.json`).then(r => r.json()).then(val => {
          let serverVal = val || 0;
          if (Date.now() - terakhirDipencet[s] > 1500) {
            skorLokal[s] = serverVal;
            document.getElementById('skor' + s).innerText = serverVal;
          }
        });
      }
    }

    function bacaRealtimeRoom(){
      fetch(`${BASE_URL}room${ROOM}/info_kelas.json`).then(res => res.json()).then(val => {
        if(val) {
          kelasAktif = val;
          document.getElementById('txtInfoKelas').innerText = "Kelas: " + kelasAktif;
        }
      });

      var es = new EventSource(`${BASE_URL}room${ROOM}/.json`);
      es.addEventListener('put', function(e){
        var d = JSON.parse(e.data);
        var waktuSekarang = Date.now();

        if(d.path === "/info_kelas" || (!d.path && d.data && d.data.info_kelas)){
          kelasAktif = d.data ? d.data.info_kelas : d.data;
          if(!kelasAktif) kelasAktif = "-";
          document.getElementById('txtInfoKelas').innerText = "Kelas: " + kelasAktif;
        }

        if(!d.path || d.path === "/" || d.path.startsWith("/skor")){
          var skorData = d.path === "/" ? d.data.skor : (d.path === "/skor" ? d.data : null);
          
          if(skorData){
            for(var s = 1; s <= 3; s++){
              var g = gtgSlot[s];
              if(skorData[g] !== undefined && (waktuSekarang - terakhirDipencet[s] > 1500)){
                skorLokal[s] = skorData[g];
                document.getElementById('skor' + s).innerText = skorData[g];
              }
            }
          } else if(d.path && d.path.startsWith("/skor/")) {
            var no = parseInt(d.path.replace("/skor/", ""));
            for(var s = 1; s <= 3; s++){
              if(no === gtgSlot[s] && (waktuSekarang - terakhirDipencet[s] > 1500)){
                skorLokal[s] = d.data || 0;
                document.getElementById('skor' + s).innerText = skorLokal[s];
              }
            }
          }
        }
      });
    }

    function tambahPoin(slot){
      var g = gtgSlot[slot];
      terakhirDipencet[slot] = Date.now();
      
      var baru = (skorLokal[slot] || 0) + 1;
      skorLokal[slot] = baru;
      document.getElementById('skor' + slot).innerText = baru;

      fetch(`${BASE_URL}room${ROOM}/skor/${g}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(baru)
      });

      if(kelasAktif && kelasAktif !== "-"){
        var historyKey = kelasAktif.replace(/[.#$\/\[\]]/g, "_");
        fetch(`${BASE_URL}room${ROOM}/history_kelas/${historyKey}/skor/${g}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(baru)
        });
      }
    }

    function bukaHistory(){
      document.getElementById('historyModal').style.display = 'flex';
      muatDataHistory();
    }

    function tutupHistory(){
      document.getElementById('historyModal').style.display = 'none';
    }

    function muatDataHistory(){
      var kontainer = document.getElementById('kontainerHistory');
      kontainer.innerHTML = `<div style="text-align:center; color:#64748b; font-size:11px; margin-top:20px;">Memuat riwayat...</div>`;

      fetch(`${BASE_URL}room${ROOM}/history_kelas.json`).then(res => res.json()).then(data => {
        if(!data){
          kontainer.innerHTML = `<div style="text-align:center; color:#94a3b8; font-size:11px; margin-top:20px;">Belum ada riwayat kelas tersimpan.</div>`;
          return;
        }

        kontainer.innerHTML = "";
        Object.keys(data).forEach(key => {
          var item = data[key];
          var namaAsli = item.nama_kelas || key;
          var skorList = item.skor || {};
          
          var rincianSkor = `Gantangan ${gtgSlot[1]}: ${skorList[gtgSlot[1]] || 0} | Gantangan ${gtgSlot[2]}: ${skorList[gtgSlot[2]] || 0} | Gantangan ${gtgSlot[3]}: ${skorList[gtgSlot[3]] || 0}`;

          var div = document.createElement('div');
          div.className = 'history-item';
          div.innerHTML = `
            <div class="history-item-info">
              <div class="history-item-title">${namaAsli}</div>
              <div style="color:#cbd5e1; margin-top:2px;">${rincianSkor}</div>
            </div>
            <button class="btn-history-reset" onclick="konfirmasiResetHistory('${key}', this)" data-klik="0">RESET (0/3)</button>
          `;
          kontainer.appendChild(div);
        });
      }).catch(() => {
        kontainer.innerHTML = `<div style="text-align:center; color:#ef4444; font-size:11px; margin-top:20px;">Gagal memuat data history.</div>`;
      });
    }

    function konfirmasiResetHistory(key, btn){
      var klikCount = parseInt(btn.getAttribute('data-klik')) + 1;
      
      if(klikCount < 3){
        btn.setAttribute('data-klik', klikCount);
        btn.innerText = `YAKIN? (${klikCount}/3)`;
        btn.style.background = "#f59e0b";
        
        setTimeout(() => {
          if(btn.getAttribute('data-klik') == klikCount){
            btn.setAttribute('data-klik', '0');
            btn.innerText = "RESET (0/3)";
            btn.style.background = "#ef4444";
          }
        }, 3000);
      } else {
        btn.innerText = "MENGHAPUS...";
        fetch(`${BASE_URL}room${ROOM}/history_kelas/${key}.json`, {
          method: 'DELETE'
        }).then(() => {
          muatDataHistory();
        });
      }
    }
  </script>
</body>
</html>
